<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da Diretoria · Instituto Cultural das Montanhas</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css?v=18">
  <link rel="stylesheet" href="css/diretoria.css?v=18">
</head>
<body>
  <header class="dir-top">
    <img src="assets/logo.png" alt="">
    <div><strong>Painel da Diretoria</strong><span id="dirSub">Instituto Cultural das Montanhas</span></div>
    <button class="btn ghost small hidden" id="dirSair">Sair</button>
  </header>
  <nav class="dir-nav hidden" id="dirNav">
    <a href="diretoria.html" data-p="avaliacao">Avaliação dos professores</a>
    <a href="diretoria.html?p=reunioes" data-p="reunioes">Reuniões pedagógicas</a>
    <a href="diretoria.html?p=visitas" data-p="visitas">Visitas pedagógicas</a>
  </nav>

  <main class="dir-main">
    <section id="dirLogin" class="card dir-login hidden">
      <h2>Acesso da diretoria</h2>
      <p class="muted">Informe a senha da diretoria fornecida pela coordenação pedagógica.</p>
      <form id="dirForm">
        <input type="password" class="input" id="dirSenha" placeholder="Senha da diretoria" autocomplete="current-password" required>
        <button class="btn primary">Entrar</button>
      </form>
      <p class="error" id="dirErro"></p>
    </section>

    <div id="dirApp" class="hidden">
      <div class="dir-filtros" id="dirFiltros"></div>
      <div id="dirView"></div>
      <p class="muted small dir-nota" id="dirRodape"></p>
    </div>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-card wide"><div class="modal-head"><h3 id="modalTitle"></h3><button class="btn ghost icon" id="modalClose" aria-label="Fechar">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loadingText">Carregando…</span></div>

  <script>
    // a página da diretoria reaproveita os cálculos do sistema sem as telas de edição
    const routes = {}, actions = {}, ui = {};
    function render() {}
    function toast(msg) { if (msg) console.log(msg); }
    async function run(fn) { return fn(); }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/config.js?v=18"></script>
  <script src="js/api.js?v=18"></script>
  <script src="js/logic.js?v=18"></script>
  <script src="js/pdf.js?v=18"></script>
  <script src="js/reunioes.js?v=18"></script>
  <script src="js/gestao.js?v=18"></script>
  <script src="js/fotos.js?v=18"></script>
  <script src="js/visitas.js?v=18"></script>
  <script src="js/diretoria.js?v=18"></script>
</body>
</html>
